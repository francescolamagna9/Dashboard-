<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800;900&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--dark:#0f0e17;--card:#1a1828;--card2:#221f35;--accent:#7c6af7;--accent2:#f7a26c;--accent3:#6affc4;--text:#e8e4ff;--muted:#7b77a0;--border:#2d2a45;--danger:#f76a6a}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(124,106,247,.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(106,255,196,.05) 0%,transparent 60%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.header{position:sticky;top:0;z-index:100;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(15,14,23,.92);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:11px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#7c6af7,#6affc4);border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 0 16px rgba(124,106,247,.4);flex-shrink:0}
.logo-text h1{font-family:'Sora',sans-serif;font-size:15px;font-weight:800;color:var(--text);line-height:1.2}
.logo-text p{font-size:10px;color:var(--muted);margin-top:1px}
.badge{background:rgba(124,106,247,.12);border:1px solid rgba(124,106,247,.3);color:#a99fff;border-radius:20px;padding:4px 11px;font-size:11px;font-weight:600;white-space:nowrap}

.tabs{position:relative;z-index:10;padding:14px 20px 0;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
.tab:hover{border-color:var(--accent);color:var(--text)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(124,106,247,.35)}
.tab-count{background:rgba(255,255,255,.18);border-radius:9px;padding:1px 6px;font-size:10px}

.main{position:relative;z-index:10;padding:18px 20px}

.top-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-bar{flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.search-bar:focus{border-color:var(--accent)}
.search-bar::placeholder{color:var(--muted)}
.add-btn{background:linear-gradient(135deg,#7c6af7,#6affc4);color:#0f0e17;border:none;border-radius:10px;padding:9px 15px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:opacity .2s;flex-shrink:0}
.add-btn:hover{opacity:.88}

.skills-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.skills-list{display:flex;flex-direction:column;gap:10px}

.skill-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:17px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.skill-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.skill-card.selected{border-color:var(--accent);background:var(--card2);box-shadow:0 0 0 3px rgba(124,106,247,.14),0 8px 24px rgba(0,0,0,.28)}
.skill-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.cat-badge{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:3px 8px;white-space:nowrap}
.cat-copy{background:rgba(247,162,108,.12);color:#f7a26c;border:1px solid rgba(247,162,108,.28)}
.cat-pm{background:rgba(106,255,196,.1);color:#6affc4;border:1px solid rgba(106,255,196,.22)}
.cat-dev{background:rgba(124,106,247,.12);color:#a99fff;border:1px solid rgba(124,106,247,.28)}
.cat-design{background:rgba(247,106,162,.1);color:#f76aa6;border:1px solid rgba(247,106,162,.22)}
.cat-seo{background:rgba(247,220,106,.1);color:#f7dc6a;border:1px solid rgba(247,220,106,.22)}
.cat-html{background:rgba(56,189,248,.1);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}
.cat-other{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.skill-ver{font-size:10px;color:var(--muted);flex-shrink:0}
.skill-name{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;color:var(--text);margin-bottom:5px;padding-right:44px}
.skill-desc{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:9px}
.skill-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:11px}
.tag{background:rgba(124,106,247,.1);color:#a99fff;border-radius:5px;padding:2px 6px;font-size:10px;font-weight:500}
.skill-footer{display:flex;justify-content:space-between;align-items:center;gap:6px}
.skill-date{font-size:10px;color:var(--muted)}
.skill-actions{display:flex;gap:5px}
.dl-btn{background:rgba(124,106,247,.14);color:#a99fff;border:1px solid rgba(124,106,247,.28);border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.dl-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.del-btn{background:rgba(247,106,106,.08);color:#f76a6a;border:1px solid rgba(247,106,106,.2);border-radius:7px;padding:5px 7px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.del-btn:hover{background:var(--danger);color:#fff}
.file-type-badge{position:absolute;top:11px;right:11px;font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--card2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;color:var(--muted)}

.detail-panel{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;position:sticky;top:72px}
.detail-empty{text-align:center;padding:36px 14px;border:1px dashed var(--border);border-radius:12px}
.detail-empty .emoji{font-size:30px;margin-bottom:8px}
.detail-empty p{font-size:12px;color:var(--muted)}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.detail-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:800}
.close-btn{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:3px;flex-shrink:0;transition:color .2s}
.close-btn:hover{color:var(--text)}
.code-block{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:9px;padding:11px;max-height:240px;overflow-y:auto;margin-bottom:11px}
.code-block pre{font-family:'Courier New',monospace;font-size:10.5px;color:#a99fff;white-space:pre-wrap;line-height:1.65}
.binary-preview{text-align:center;padding:24px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:9px;margin-bottom:11px}
.binary-preview .file-icon{font-size:36px;margin-bottom:6px}
.binary-preview p{font-size:12px;color:var(--muted)}
.binary-preview .file-size{font-size:10px;color:var(--muted);margin-top:3px}
.dl-btn-full{width:100%;background:linear-gradient(135deg,#7c6af7,#6affc4);color:#0f0e17;border:none;border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.02em;transition:opacity .2s}
.dl-btn-full:hover{opacity:.88}
/* HTML preview */
.preview-toggle{display:flex;gap:4px;margin-bottom:10px;background:rgba(0,0,0,.3);border-radius:9px;padding:3px}
.ptog-btn{flex:1;background:none;border:none;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;color:var(--muted);transition:all .2s}
.ptog-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(124,106,247,.3)}
.html-iframe{width:100%;height:320px;border:1px solid var(--border);border-radius:9px;background:#fff;margin-bottom:11px;display:block}
.html-iframe-wrap{position:relative;margin-bottom:11px}
.iframe-overlay-msg{position:absolute;bottom:8px;right:8px;background:rgba(15,14,23,.85);border:1px solid var(--border);border-radius:7px;padding:4px 9px;font-size:10px;color:var(--muted);pointer-events:none}
.empty-state{text-align:center;padding:44px 16px;color:var(--muted)}
.empty-state div{font-size:32px;margin-bottom:10px}
/* ── GITHUB SYNC ── */
.sync-bar{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sync-status{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;cursor:pointer;transition:all .2s;border:1px solid transparent;white-space:nowrap}
.sync-status.disconnected{background:rgba(247,106,106,.08);color:#f76a6a;border-color:rgba(247,106,106,.2)}
.sync-status.connected{background:rgba(106,255,196,.08);color:#6affc4;border-color:rgba(106,255,196,.2)}
.sync-status.syncing{background:rgba(124,106,247,.1);color:#a99fff;border-color:rgba(124,106,247,.25)}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sync-dot.red{background:#f76a6a}
.sync-dot.green{background:#6affc4;box-shadow:0 0 6px #6affc4}
.sync-dot.pulse{background:#a99fff;animation:pulse-dot .9s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* token modal */
.token-modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;width:100%;max-width:420px;transform:translateY(18px);transition:transform .22s}
.modal-overlay.open .token-modal{transform:translateY(0)}
.token-info{background:rgba(247,162,108,.06);border:1px solid rgba(247,162,108,.2);border-radius:10px;padding:12px;font-size:11px;color:#f7a26c;line-height:1.6;margin-bottom:14px}
.token-field{position:relative}
.token-field input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:9px 36px 9px 11px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;letter-spacing:.04em}
.token-field input:focus{border-color:var(--accent)}
.token-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px}
.gh-connect-btn{width:100%;background:linear-gradient(135deg,#24292e,#444d56);color:#fff;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:12px;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.gh-connect-btn:hover{opacity:.88}
.gh-disconnect-btn{width:100%;background:rgba(247,106,106,.08);color:#f76a6a;border:1px solid rgba(247,106,106,.2);border-radius:10px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;transition:all .2s}
.gh-disconnect-btn:hover{background:var(--danger);color:#fff}
.gh-user-row{display:flex;align-items:center;gap:10px;background:rgba(106,255,196,.06);border:1px solid rgba(106,255,196,.2);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.gh-avatar{width:32px;height:32px;border-radius:50%;border:2px solid rgba(106,255,196,.3)}
.gh-uname{font-size:13px;font-weight:700;color:var(--accent3)}
.gh-repo{font-size:10px;color:var(--muted)}
.sync-actions{display:flex;gap:8px;margin-top:12px}
.sync-pull-btn,.sync-push-btn{flex:1;border:none;border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.sync-pull-btn{background:rgba(56,189,248,.1);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}
.sync-pull-btn:hover{background:#38bdf8;color:#0f0e17}
.sync-push-btn{background:rgba(106,255,196,.1);color:#6affc4;border:1px solid rgba(106,255,196,.25)}
.sync-push-btn:hover{background:#6affc4;color:#0f0e17}
.sync-log{font-size:10px;color:var(--muted);margin-top:8px;text-align:center;min-height:16px}


/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;transform:translateY(18px);transition:transform .22s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h2{font-family:'Sora',sans-serif;font-size:16px;font-weight:800}
.modal-body{display:flex;flex-direction:column;gap:13px}
.field label{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field select{cursor:pointer}
.field select option{background:var(--card2)}
.field textarea{resize:vertical;min-height:75px;line-height:1.55}
.tags-input-wrap{display:flex;gap:5px}
.tags-input-wrap input{flex:1}
.tags-input-wrap button{background:rgba(124,106,247,.14);color:#a99fff;border:1px solid rgba(124,106,247,.28);border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:all .2s}
.tags-input-wrap button:hover{background:var(--accent);color:#fff}
.tags-preview{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag-pill{background:rgba(124,106,247,.1);color:#a99fff;border-radius:6px;padding:2px 7px;font-size:11px;display:flex;align-items:center;gap:3px}
.tag-pill button{background:none;border:none;color:#a99fff;cursor:pointer;font-size:13px;padding:0;line-height:1}
.drop-zone{border:2px dashed var(--border);border-radius:11px;padding:22px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(0,0,0,.18)}
.drop-zone:hover,.drop-zone.dragging{border-color:var(--accent);background:rgba(124,106,247,.05)}
.drop-zone .dz-icon{font-size:26px;margin-bottom:6px}
.drop-zone p{font-size:12px;color:var(--muted);line-height:1.55}
.drop-zone .dz-types{font-size:10px;color:var(--muted);margin-top:3px;opacity:.65}
.drop-zone.has-file{border-color:var(--accent3);background:rgba(106,255,196,.04)}
.drop-zone.has-file p{color:var(--accent3)}
.modal-footer{display:flex;gap:7px;margin-top:18px}
.btn-cancel{flex:1;background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:9px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-cancel:hover{border-color:var(--muted);color:var(--text)}
.btn-save{flex:2;background:linear-gradient(135deg,#7c6af7,#6affc4);color:#0f0e17;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .2s}
.btn-save:hover{opacity:.88}
.btn-save:disabled{opacity:.4;cursor:not-allowed}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:9px 18px;font-size:12px;font-weight:600;z-index:2000;transition:all .3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--accent3);color:var(--accent3)}
.toast.error{border-color:var(--danger);color:var(--danger)}

/* ROADMAP */
.roadmap-header{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:11px}
.roadmap-header h2{font-family:'Sora',sans-serif;font-size:14px;font-weight:800}
.roadmap-header p{font-size:10px;color:var(--muted);margin-top:2px}
.roadmap-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.roadmap-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;cursor:pointer;transition:all .2s}
.step-card:hover{transform:translateY(-2px)}
.step-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.step-emoji{font-size:17px;background:var(--card2);border-radius:7px;padding:3px 6px;flex-shrink:0}
.step-phase{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.step-title{font-family:'Sora',sans-serif;font-size:12px;font-weight:800}
.step-desc{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:5px}
.step-owner{font-size:9px;color:var(--muted);font-weight:600}
.detail-step{background:var(--card);border-radius:13px;padding:18px;border:1px solid var(--border)}
.ds-header{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.ds-emoji{font-size:24px}
.ds-phase{font-size:10px;font-weight:700;letter-spacing:.1em}
.ds-title{font-family:'Sora',sans-serif;font-size:16px;font-weight:800}
.ds-desc{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:12px}
.ds-section h4{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.deliverable{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text);margin-bottom:4px}
.deliverable .arrow{font-weight:700}
.tools-list{display:flex;gap:5px;flex-wrap:wrap}
.tool-badge{border-radius:7px;padding:3px 9px;font-size:10px;font-weight:600}
.pipeline{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 16px}
.pipeline h4{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.pipeline-track{display:flex;align-items:center}
.pip-node{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:2px solid;transition:all .2s;flex-shrink:0;background:var(--card2)}
.pip-node:hover{transform:scale(1.12)}
.pip-line{flex:1;height:2px}
.pipeline-labels{display:flex;justify-content:space-between;margin-top:4px}
.pipeline-labels span{font-size:9px;color:var(--muted)}

/* inline detail that appears under a card on mobile */
.inline-detail{display:none;margin-top:8px;animation:fadeIn .25s ease forwards}
.inline-detail.open{display:block}

.section-hidden{display:none}
.section-visible{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeIn .28s ease forwards}

/* ── PROGETTO ── */
.project-setup{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:360px;text-align:center;padding:32px 20px}
.project-setup .ps-icon{font-size:44px;margin-bottom:16px}
.project-setup h2{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;margin-bottom:8px}
.project-setup p{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.6}
.project-name-row{display:flex;gap:8px;width:100%;max-width:440px;margin-bottom:12px}
.project-name-row input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s}
.project-nam
